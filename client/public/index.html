<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Smart freight consolidation and route optimization for Australian logistics" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Skya Truck Optimisation Bot - Smart Freight Planning</title>
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Tailwind CSS CDN for faster development -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* Loading animation for better UX */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .truck-loader {
        width: 60px;
        height: 40px;
        background: #0ea5e9;
        border-radius: 4px;
        position: relative;
        animation: drive 2s linear infinite;
      }
      
      .truck-loader::before {
        content: '';
        position: absolute;
        width: 12px;
        height: 12px;
        background: #1e293b;
        border-radius: 50%;
        bottom: -6px;
        left: 8px;
      }
      
      .truck-loader::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 12px;
        background: #1e293b;
        border-radius: 50%;
        bottom: -6px;
        right: 8px;
      }
      
      @keyframes drive {
        0% { transform: translateX(-50px); }
        100% { transform: translateX(50px); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="truck-loader mb-6"></div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Skya Truck Optimisation Bot</h2>
      <p class="text-gray-600">Loading freight optimization engine...</p>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.remove(), 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
